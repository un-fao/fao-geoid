name: deploy

# Build -> migrate -> deploy to Cloud Run. Push to the review branch -> review (path-filtered);
# publishing a GitHub Release -> production (always, a release event is a tag ref).
# Keyless WIF auth (no SA JSON in GitHub). Migrations run as a blocking Cloud Run Job
# before the service is updated, so a failed `alembic upgrade head` fails the deploy.
on:
  push:
    branches: [review]
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"   # baked into the image; the canary + smoke jobs run from it
      - "Dockerfile"
      - "cloudbuild.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]

# Never cancel a deploy mid-flight (a half-applied migration + old revision is worse
# than a queued run); serialize instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # mint the OIDC token WIF exchanges for GCP credentials
  contents: read

jobs:
  # Gate: the deploy job must NOT start unless pre-commit is green. Mirrors the
  # standalone pre-commit.yml so a lint/format failure blocks the deploy at the
  # source instead of shipping it (a same-run `needs:` is the reliable cross-check —
  # the separate pre-commit workflow can't gate this one).
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: pre-commit/action@v3.0.1

  # Gate: the deploy must also wait on the test suite. Mirrors ci.yml in-run (same
  # reason as lint above — a separate workflow can't gate this one), so a failing
  # test or a sub-80% coverage gate blocks the deploy before it ships.
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # sys.monitoring core: the legacy C tracer misses async ASGI handlers, so
      # without this the coverage number is badly under-reported (see conftest).
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Alembic migration sanity (single head)
        run: |
          heads=$(uv run alembic heads | grep -c '(head)')
          test "$heads" -eq 1

      # ubuntu-latest provides a Docker daemon, so testcontainers spins an
      # ephemeral PostGIS (amd64, native) for the integration tests.
      - name: Tests (unit + integration) with coverage gate
        env:
          GEOID_DATABASE_URL: postgresql+asyncpg://geoid:geoid@localhost:5432/geoid
        run: >
          uv run pytest
          --cov=geoid
          --cov-report=term-missing
          --cov-fail-under=80

  # Build the image in PARALLEL with lint+test (no `needs:`) instead of after the test
  # gate — the build doesn't depend on test results, so overlapping it shaves the 86s
  # build off the critical path. `deploy` still gates on lint+test+build, so nothing
  # ships unless the suite is green; a built-but-untested :{sha} image is simply never
  # deployed. :latest is used ONLY as the Cloud Build layer cache source, never for deploy.
  build:
    # Same target selection as deploy: release -> production, push -> review. Required so
    # the environment-scoped vars.* below resolve.
    environment: ${{ github.event_name == 'release' && 'production' || 'review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
      SERVICE: ${{ vars.SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.ACTIONS_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve image reference
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT}/${ARTIFACT_REGISTRY}/${SERVICE}:${{ github.sha }}" >> "$GITHUB_ENV"

      # cloudbuild.yaml enables BuildKit; the `--tag` shortcut can't (see that file).
      # --suppress-logs: the least-privilege Actions SA isn't a project Viewer, so gcloud
      # refuses to stream the default-bucket logs and exits 1 *before* the build finishes
      # (a false failure — the build itself succeeds). Suppressing the stream keeps the
      # step synchronous: it still polls to completion and fails if the build fails. Build
      # logs remain in the Cloud Build console (URL printed by the command).
      - name: Build and push image (Cloud Build)
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _IMAGE="$IMAGE" \
            --project "$PROJECT" \
            --service-account "projects/$PROJECT/serviceAccounts/${{ vars.ACTIONS_SERVICE_ACCOUNT }}" \
            --suppress-logs

  deploy:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A release event -> production; a push (to the review branch) -> review. The selected
    # GitHub Environment supplies all vars.*/secrets below, so the job body is unchanged.
    environment: ${{ github.event_name == 'release' && 'production' || 'review' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'release' && 'production' || 'review' }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
      SERVICE: ${{ vars.SERVICE_NAME }}
      RUN_SERVICE_ACCOUNT: ${{ vars.RUN_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.ACTIONS_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve image reference
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT}/${ARTIFACT_REGISTRY}/${SERVICE}:${{ github.sha }}" >> "$GITHUB_ENV"

      # The image is built+pushed by the parallel `build` job above (deploy needs: build),
      # so it's already in Artifact Registry under :{sha}. Deploy only resolves the same
      # deterministic ref (no rebuild) and ships it.

      # Idempotent `alembic upgrade head`, blocking: --wait fails the step (and the
      # deploy) if the migration job exits non-zero. --max-retries 0 = no silent retry.
      - name: Run migrations (Cloud Run Job)
        run: |
          gcloud run jobs deploy "${SERVICE}-upgrade-head" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest \
            --set-env-vars GEOID_ENVIRONMENT="$TARGET_ENV" \
            --command geoid --args migrate \
            --max-retries 0
          gcloud run jobs execute "${SERVICE}-upgrade-head" \
            --region "$REGION" \
            --project "$PROJECT" \
            --wait

      # Golden-vector identity canary: recipe v2 (migration 0008, ADR-007) is
      # engine-independent, so this asserts the DEPLOYED geoid_geom_hash_v2 (and the
      # geoid_geom_hash_default wrapper the arbiter uses) is byte-identical to the
      # pure-Python reference that generated the corpus — any drift (exit 3) fails
      # the deploy HERE, before the service ships. Runs after migrate (the function
      # must exist). The script falls back to GEOID_DATABASE_URL (asyncpg scheme
      # normalized) when --dsn is absent.
      - name: Golden-vector identity canary (Cloud Run Job)
        run: |
          gcloud run jobs deploy "${SERVICE}-vectors-check" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest \
            --command python \
            --args "scripts/dedup_vectors.py,--check" \
            --max-retries 0
          gcloud run jobs execute "${SERVICE}-vectors-check" \
            --region "$REGION" \
            --project "$PROJECT" \
            --wait

      - name: Deploy service (Cloud Run)
        run: |
          # OIDC dual-auth is enabled at REVIEW only (the static admin token is
          # unaffected either way — no flag day). Prod stays OIDC-off until CSI
          # delivers the production realm, so the fragment is empty for production and
          # the env-var string is byte-identical to before. The review issuer + JWKS
          # URL come from the review GitHub Environment's vars (realm <realm>);
          # audience/roles-client/admin-role use the config.py defaults. The Swagger
          # sign-in button is also turned on at review (it renders now; it only
          # completes once CSI registers the geoid-fe Swagger redirect URI).
          OIDC_ENV=""
          if [ "$TARGET_ENV" = "review" ]; then
            OIDC_ENV="@GEOID_OIDC_ISSUER=${{ vars.GEOID_OIDC_ISSUER }}@GEOID_OIDC_JWKS_URL=${{ vars.GEOID_OIDC_JWKS_URL }}@GEOID_SWAGGER_OAUTH2_ENABLED=true"
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest,GEOID_ADMIN_TOKEN=geoid-admin-token:latest \
            --set-env-vars "^@^GEOID_ENVIRONMENT=$TARGET_ENV@GEOID_BASE_URL=${{ vars.GEOID_BASE_URL }}@GEOID_ROOT_PATH=${{ vars.GEOID_ROOT_PATH }}@GEOID_INSTANCE_ID=${{ vars.GEOID_INSTANCE_ID }}@GEOID_PUBLIC_COLLECTION=${{ vars.GEOID_PUBLIC_COLLECTION }}@GEOID_BULK_MAX_FEATURES=2500@GEOID_DB_POOL_SIZE=5@GEOID_DB_MAX_OVERFLOW=15${OIDC_ENV}" \
            --port 8000 \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --min-instances 0 \
            --max-instances 4 \
            --memory 1Gi \
            --timeout 600 \
            --concurrency 16 \
            --cpu-boost
          # Connection/memory budget (kept coherent on purpose): pool 5 + overflow 15
          # = 20 conns/instance x 4 max instances = 80, leaving headroom under a small
          # Cloud SQL tier's ~100 max_connections for the migrate/canary jobs and ops.
          # --concurrency 16 bounds how many (up to 2500-feature) bulk bodies one
          # 1 GiB instance parses at once — the Cloud Run default of 80 was an OOM risk.

      - name: Install uv (for the smoke script)
        uses: astral-sh/setup-uv@v8.2.0

      - name: Smoke test new revision
        env:
          GEOID_PUBLIC_COLLECTION: ${{ vars.GEOID_PUBLIC_COLLECTION }}
          # Public base the service mints links under (origin + sub-path). smoke_test.py
          # asserts returned links carry THIS host, so it must hit the public URL — not
          # the direct *.run.app URL, where root_path isn't stripped.
          PUBLIC_URL: ${{ vars.GEOID_BASE_URL }}${{ vars.GEOID_ROOT_PATH }}
        run: |
          # Hard gate: liveness + DB probe on the direct Cloud Run URL (served at root,
          # needs no proxy). The revision must boot and reach Postgres or the deploy fails.
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          curl --fail --silent --show-error "$URL/health"
          # End-to-end link/identifier check against the public URL. Best-effort: on a
          # fresh review env the LB/DNS may not be wired yet, so don't fail the deploy.
          GEOID_BASE_URL="$PUBLIC_URL" GEOID_COLLECTION="$GEOID_PUBLIC_COLLECTION" \
            uv run --no-project --with httpx python scripts/smoke_test.py \
            || echo "::warning::end-to-end smoke against $PUBLIC_URL skipped/failed (LB/DNS not ready?)"
