name: deploy

# Build -> migrate -> deploy to Cloud Run on every push to main. Keyless WIF auth
# (no SA JSON in GitHub). Migrations run as a blocking Cloud Run Job before the
# service is updated, so a failed `alembic upgrade head` fails the deploy.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "Dockerfile"
      - "cloudbuild.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

# Never cancel a deploy mid-flight (a half-applied migration + old revision is worse
# than a queued run); serialize instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # mint the OIDC token WIF exchanges for GCP credentials
  contents: read

jobs:
  # Gate: the deploy job must NOT start unless pre-commit is green. Mirrors the
  # standalone pre-commit.yml so a lint/format failure blocks the deploy at the
  # source instead of shipping it (a same-run `needs:` is the reliable cross-check —
  # the separate pre-commit workflow can't gate this one).
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: pre-commit/action@v3.0.1

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment: review
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
      SERVICE: ${{ vars.SERVICE_NAME }}
      RUN_SERVICE_ACCOUNT: ${{ vars.RUN_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.ACTIONS_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve image reference
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT}/${ARTIFACT_REGISTRY}/${SERVICE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "INGEST_WORKER_JOB=${SERVICE}-ingest-worker" >> "$GITHUB_ENV"

      # cloudbuild.yaml enables BuildKit; the `--tag` shortcut can't (see that file).
      - name: Build and push image (Cloud Build)
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _IMAGE="$IMAGE" \
            --project "$PROJECT"

      # Idempotent `alembic upgrade head`, blocking: --wait fails the step (and the
      # deploy) if the migration job exits non-zero. --max-retries 0 = no silent retry.
      - name: Run migrations (Cloud Run Job)
        run: |
          gcloud run jobs deploy "${SERVICE}-migrate" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest \
            --set-env-vars GEOID_ENVIRONMENT=review \
            --command geoid --args migrate \
            --max-retries 0
          gcloud run jobs execute "${SERVICE}-migrate" \
            --region "$REGION" \
            --project "$PROJECT" \
            --wait

      # The async bulk-ingest worker: same image, args ["ingest-worker"]. Created
      # (not executed) here; it is triggered on demand by the web service (jobs.run)
      # and by a Cloud Scheduler fallback drain. It builds full Settings, so it needs
      # a real GEOID_ADMIN_TOKEN (the dev-token guard) and the storage config to read
      # by-reference blobs. Email stays off until the org dependency exists: once the
      # Entra app reg + Mail.Send consent + sender mailbox are ready, add
      # GEOID_NOTIFY_BACKEND=graph + GEOID_GRAPH_* env and the worker-only
      # geoid-graph-client-secret mount here (see local-docs/DEPLOYMENT.md).
      - name: Deploy ingest worker Job (Cloud Run)
        run: |
          gcloud run jobs deploy "$INGEST_WORKER_JOB" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest,GEOID_ADMIN_TOKEN=geoid-admin-token:latest \
            --set-env-vars "^@^GEOID_ENVIRONMENT=review@GEOID_BASE_URL=${{ vars.GEOID_BASE_URL }}@GEOID_ROOT_PATH=${{ vars.GEOID_ROOT_PATH }}@GEOID_INSTANCE_ID=${{ vars.GEOID_INSTANCE_ID }}@GEOID_PUBLIC_COLLECTION=${{ vars.GEOID_PUBLIC_COLLECTION }}@GEOID_VOCAB=${{ vars.GEOID_VOCAB }}@GEOID_STORAGE_BACKEND=${{ vars.GEOID_STORAGE_BACKEND }}@GEOID_STORAGE_GCS_BUCKET=${{ vars.GEOID_STORAGE_GCS_BUCKET }}" \
            --command geoid --args ingest-worker \
            --max-retries 1

      - name: Deploy service (Cloud Run)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --network "${{ vars.VPC_NETWORK }}" \
            --subnet "${{ vars.VPC_SUBNET }}" \
            --vpc-egress private-ranges-only \
            --set-secrets GEOID_DATABASE_URL=geoid-database-url:latest,GEOID_ADMIN_TOKEN=geoid-admin-token:latest \
            --set-env-vars "^@^GEOID_ENVIRONMENT=review@GEOID_BASE_URL=${{ vars.GEOID_BASE_URL }}@GEOID_ROOT_PATH=${{ vars.GEOID_ROOT_PATH }}@GEOID_INSTANCE_ID=${{ vars.GEOID_INSTANCE_ID }}@GEOID_PUBLIC_COLLECTION=${{ vars.GEOID_PUBLIC_COLLECTION }}@GEOID_VOCAB=${{ vars.GEOID_VOCAB }}@GEOID_STORAGE_BACKEND=${{ vars.GEOID_STORAGE_BACKEND }}@GEOID_STORAGE_GCS_BUCKET=${{ vars.GEOID_STORAGE_GCS_BUCKET }}@GEOID_INGEST_JOB_NAME=${INGEST_WORKER_JOB}@GEOID_INGEST_JOB_REGION=${REGION}@GEOID_INGEST_JOB_PROJECT=${PROJECT}" \
            --port 8000 \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --min-instances 0 \
            --max-instances 4 \
            --cpu-boost

      # Plain-drain trigger: the web service (and the Scheduler fallback) only need
      # roles/run.invoker on the Job — no overrides, so no run.jobs.runWithOverrides.
      - name: Allow service + scheduler to trigger the worker Job (run.invoker)
        run: |
          SCHEDULER_SA="${{ vars.SCHEDULER_SERVICE_ACCOUNT }}"
          SCHEDULER_SA="${SCHEDULER_SA:-$RUN_SERVICE_ACCOUNT}"
          for SA in "$RUN_SERVICE_ACCOUNT" "$SCHEDULER_SA"; do
            gcloud run jobs add-iam-policy-binding "$INGEST_WORKER_JOB" \
              --member="serviceAccount:${SA}" \
              --role="roles/run.invoker" \
              --region "$REGION" --project "$PROJECT"
          done

      # bulk-export writes a GeoJSON object to GCS and returns a V4 SIGNED URL. Signing
      # without a private key needs the worker's runtime SA to impersonate itself
      # (roles/iam.serviceAccountTokenCreator → the signBlob API). Harmless until
      # bulk-export is used; required the moment it is.
      # TODO(bulk-export): best-effort until the deployer SA has iam.serviceAccounts.setIamPolicy
      # on the runtime SA (or this binding is applied once by hand). See DEPLOYMENT.md §4a.
      - name: Allow the worker SA to sign bulk-export download URLs (V4 signBlob)
        continue-on-error: true
        run: |
          gcloud iam service-accounts add-iam-policy-binding "$RUN_SERVICE_ACCOUNT" \
            --member="serviceAccount:${RUN_SERVICE_ACCOUNT}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --project "$PROJECT"

      # Durable-queue fallback: the trigger is a fallible, quota-gated API call, so a
      # low-frequency Scheduler run drains anything whose trigger was dropped (the
      # durable ingest_job row makes a missed trigger a delay, not a loss). v2 run API.
      # TODO(bulk): best-effort until the deployer SA can actAs the scheduler SA and
      # create Cloud Scheduler jobs (or this is set up once by hand). See DEPLOYMENT.md §4a.
      - name: Cloud Scheduler fallback drain (every 20 min)
        continue-on-error: true
        run: |
          SCHEDULER_SA="${{ vars.SCHEDULER_SERVICE_ACCOUNT }}"
          SCHEDULER_SA="${SCHEDULER_SA:-$RUN_SERVICE_ACCOUNT}"
          URI="https://${REGION}-run.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/jobs/${INGEST_WORKER_JOB}:run"
          gcloud scheduler jobs create http "${INGEST_WORKER_JOB}-drain" \
            --location "$REGION" --project "$PROJECT" \
            --schedule "*/20 * * * *" \
            --uri "$URI" --http-method POST \
            --oauth-service-account-email "$SCHEDULER_SA" \
          || gcloud scheduler jobs update http "${INGEST_WORKER_JOB}-drain" \
            --location "$REGION" --project "$PROJECT" \
            --schedule "*/20 * * * *" \
            --uri "$URI" --http-method POST \
            --oauth-service-account-email "$SCHEDULER_SA"

      - name: Install uv (for the smoke script)
        uses: astral-sh/setup-uv@v8.2.0

      - name: Smoke test new revision
        env:
          GEOID_PUBLIC_COLLECTION: ${{ vars.GEOID_PUBLIC_COLLECTION }}
          # Public base the service mints links under (origin + sub-path). smoke_test.py
          # asserts returned links carry THIS host, so it must hit the public URL — not
          # the direct *.run.app URL, where root_path isn't stripped.
          PUBLIC_URL: ${{ vars.GEOID_BASE_URL }}${{ vars.GEOID_ROOT_PATH }}
        run: |
          # Hard gate: liveness + DB probe on the direct Cloud Run URL (served at root,
          # needs no proxy). The revision must boot and reach Postgres or the deploy fails.
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          curl --fail --silent --show-error "$URL/health"
          # End-to-end link/identifier check against the public URL. Best-effort: on a
          # fresh review env the LB/DNS may not be wired yet, so don't fail the deploy.
          GEOID_BASE_URL="$PUBLIC_URL" GEOID_COLLECTION="$GEOID_PUBLIC_COLLECTION" \
            uv run --no-project --with httpx python scripts/smoke_test.py \
            || echo "::warning::end-to-end smoke against $PUBLIC_URL skipped/failed (LB/DNS not ready?)"
