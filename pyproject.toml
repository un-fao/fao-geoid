[project]
name = "geoid"
version = "0.1.0"
description = "GeoID — global federated registry minting immutable, secure identifiers for geospatial places (OGC API Features over PostGIS)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FAO GeoID Team" }]
keywords = ["geospatial", "ogc", "postgis", "registry", "fao"]

dependencies = [
    # Web framework + server
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    # Async DB stack
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    # GeoJSON + validation
    "geojson-pydantic>=2.1,<2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # HTTP client for the completion-notification seam (MS Graph sendMail + OGC
    # callbacks); lazily used, so notify_backend=none never imports it.
    "httpx>=0.27",
    # Geometry + CQL2 filtering
    "shapely>=2.0",
    "pyproj>=3.6",
    "pygeofilter>=0.3,<0.4",
    "lark>=1.1",
    # Stdlib-friendly extras
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# FAO GCP integration (kept optional so the core image imports no GCP SDK): the GCS
# object-storage backend + the Cloud Run jobs.run trigger seam for the async ingest
# worker. Both are lazy-imported, so an on-prem deploy of the same image never loads
# them. The image is built with --extra gcs.
gcs = ["gcsfs>=2024.9", "google-cloud-run>=0.10"]
# Post-demo OIDC resource-server auth (Keycloak / FAO IdP); MVP uses a static token
oidc = ["authlib>=1.3", "httpx>=0.27"]

[project.scripts]
geoid = "geoid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.15",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoid"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "unit: pure unit tests, no external services",
    "integration: requires an ephemeral PostGIS container (Docker)",
    "load: load/performance tests (k6 / locust)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends(...) in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Tests carry inline GeoJSON / URL literals where wrapping hurts readability.
"tests/**" = ["E501"]
# Migrations embed long SQL strings (trigger bodies, RAISE messages).
"migrations/**" = ["E501"]
# Dev scripts have aligned print/format lines where wrapping hurts readability.
"scripts/**" = ["E501"]

[tool.coverage.run]
source = ["geoid"]
# Line coverage (the 80% target). Branch coverage is disabled so the sys.monitoring
# core (COVERAGE_CORE=sysmon) can be used — it traces async ASGI handlers that the
# legacy C tracer misses, but on this coverage version it can't measure branches.
branch = false
