# BuildKit (DOCKER_BUILDKIT=1) so the Dockerfile's `RUN --mount=...` mounts work;
# the `builds submit --tag` shortcut runs legacy Docker and rejects them.
steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
